[project]
name = "navic"
version = "0.1.0"
description = "Opportunity Intelligence Platform — continuously discovers public buying signals and turns them into evidence-backed opportunities."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "python-dateutil>=2.9",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
]

# The monorepo uses a flat `packages/` source root (see docs/FOLDER_STRUCTURE.md).
# Each subdirectory of packages/ is an importable top-level package, e.g. `from core.config import settings`.
[tool.pytest.ini_options]
pythonpath = ["packages"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
mypy_path = "packages"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
namespace_packages = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/core"]
